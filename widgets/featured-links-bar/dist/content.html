<style>
  :host {
    display: block;
    font-family: var(--font-family-sans, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif);
  }

  .flb {
    --head-color: #2F8CF0;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 14px 32px;
    background: #ffffff;
    border-radius: 16px;
    color: #1F2A44;
  }

  .flb * {
    box-sizing: border-box;
  }

  .flb-head {
    display: flex;
    flex: none;
    align-items: center;
    gap: 10px;
    padding-right: 18px;
    border-right: 1px solid #D8DCE6;
    font-size: 18px;
    font-weight: 800;
    white-space: nowrap;
  }

  .flb-head-icon {
    color: var(--head-color);
    font-size: 18px;
  }

  .flb-list {
    display: flex;
    flex: 1 1 auto;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .flb-pill {
    --c: #2F8CF0;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 6px 22px 6px 6px;
    border: 1px solid #E3E6EE;
    border-radius: 999px;
    background: #ffffff;
    color: #1F2A44;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .flb-pill:hover {
    transform: translateY(-1px);
    border-color: color-mix(in srgb, var(--c) 45%, #ffffff);
    box-shadow: 0 4px 12px rgba(40, 80, 140, 0.14);
  }

  .flb-pill:focus-visible,
  .flb-more:focus-visible {
    outline: 2px solid var(--head-color);
    outline-offset: 2px;
  }

  .flb-pill-icon {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--c) 18%, #ffffff);
    color: var(--c);
    font-size: 18px;
    line-height: 1;
  }

  .flb-pill-icon[hidden] {
    display: none;
  }

  .flb-pill.no-icon {
    padding-left: 22px;
  }

  .flb-more {
    flex: none;
    margin-left: auto;
    color: #1F2A44;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
  }

  .flb-more:hover {
    text-decoration: underline;
  }

  .flb-more[hidden],
  .flb-head[hidden] {
    display: none;
  }

  @media (max-width: 900px) {
    .flb {
      flex-wrap: wrap;
      padding: 14px 16px;
    }

    .flb-head {
      border-right: 0;
      padding-right: 0;
    }

    .flb-list {
      flex-basis: 100%;
      order: 2;
    }

    .flb-more {
      order: 1;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .flb-pill {
      transition: none;
    }
  }
</style>

<div class="flb">
  <div class="flb-head">
    <span class="flb-head-icon" aria-hidden="true"></span>
    <span class="flb-head-text"></span>
  </div>
  <ul class="flb-list"></ul>
  <a class="flb-more" href="#"></a>
</div>

<script type="module" src="app.js"></script>
