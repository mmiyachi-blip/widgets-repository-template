<style>
  :host {
    display: block;
    font-family: var(--font-family-sans, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif);
  }

  .cal-wrap {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--color-surface-default, #ffffff);
    border: 1px solid var(--color-line-default, #DEDFE2);
    border-radius: 20px;
    padding: 32px;
    box-sizing: border-box;
  }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .cal-month-label {
    font-size: 20px;
    font-weight: 700;
    color: var(--color-content-default, #2B3346);
  }

  .cal-nav {
    display: flex;
    gap: 8px;
  }

  .cal-nav button {
    border: none;
    background: var(--w-accent, #F2789F);
    color: #ffffff;
    border-radius: 999px;
    padding: 7px 16px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
  }

  .cal-nav button:hover {
    filter: brightness(0.95);
  }

  .cal-status {
    display: none;
    text-align: center;
    padding: 14px;
    color: var(--color-content-subtle, #6B7280);
    font-size: 14px;
  }

  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--color-content-subtle, #6B7280);
    margin-bottom: 6px;
  }

  .cal-weekdays span:first-child { color: #E4574C; }
  .cal-weekdays span:last-child { color: #3E8ED0; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }

  .cal-cell {
    min-height: 96px;
    background: var(--color-surface-subtle, #F7F7F9);
    border-radius: 12px;
    padding: 8px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .cal-cell--empty {
    background: transparent;
  }

  .cal-cell--today {
    background: var(--w-accent-soft, #FCE7EF);
    border: 1px solid var(--w-accent, #F2789F);
  }

  .cal-date {
    font-size: 15px;
    font-weight: 700;
    color: var(--color-content-default, #2B3346);
  }

  .cal-badges {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .cal-badge {
    display: flex;
    align-items: flex-start;
    gap: 5px;
    font-size: 15px;
    line-height: 1.3;
    color: #ffffff;
    border-radius: 8px;
    padding: 4px 7px;
    text-decoration: none;
  }

  .cal-badge-icon {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    line-height: 1;
    margin-top: 1px;
  }

  .cal-badge-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 3px;
    display: block;
  }

  .cal-badge-text {
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow-wrap: anywhere;
  }

  .cal-more {
    font-size: 13px;
    color: var(--color-content-subtle, #6B7280);
  }

  .cal-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--color-line-default, #DEDFE2);
  }

  .cal-legend-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: var(--color-content-default, #2B3346);
    background: var(--color-surface-subtle, #F7F7F9);
    border-radius: 999px;
    padding: 5px 12px 5px 6px;
  }

  .cal-legend-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    flex: 0 0 auto;
  }

  .cal-legend-dot img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 50%;
  }

  @media (max-width: 720px) {
    .cal-wrap { padding: 16px; }
    .cal-month-label { font-size: 17px; }
    .cal-cell { min-height: 72px; padding: 5px; }
    .cal-date { font-size: 13px; }
    .cal-badge { font-size: 12px; padding: 3px 6px; }
    .cal-badge-icon { width: 13px; height: 13px; font-size: 11px; }
  }
</style>

<div class="cal-wrap">
  <div class="cal-header">
    <div class="cal-month-label"></div>
    <div class="cal-nav">
      <button class="cal-prev" type="button">&lt; 前月</button>
      <button class="cal-today" type="button">今日</button>
      <button class="cal-next" type="button">次月 &gt;</button>
    </div>
  </div>
  <div class="cal-status"></div>
  <div class="cal-weekdays">
    <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
  </div>
  <div class="cal-grid"></div>
  <div class="cal-legend"></div>
</div>

<script type="module" src="app.js"></script>
