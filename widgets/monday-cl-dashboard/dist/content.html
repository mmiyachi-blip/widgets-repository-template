<style>
  .cl-card {
    font-family: var(--font-family-sans, Roboto, sans-serif);
    border: 1px solid var(--color-line-default, #DEDFE2);
    border-radius: 12px;
    background: var(--color-surface-default, #FFFFFF);
    padding: 20px 22px;
    max-width: 760px;
  }
  .cl-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .cl-head h2 { margin: 0; font-size: 18px; color: var(--color-content-default, #2B3346); }
  .cl-head p { margin: 2px 0 0; font-size: 13px; color: var(--color-content-subtle, #4F5663); }
  .cl-badge { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--color-action-primary-subtle, #F1EBFB); color: var(--color-action-primary-default, #9254D9); white-space: nowrap; }
  .cl-section { border-top: 1px solid var(--color-line-default, #DEDFE2); margin-top: 14px; padding-top: 14px; }
  .cl-section h3 { font-size: 14px; margin: 0 0 8px; color: var(--color-content-default, #2B3346); }
  .cl-cta-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--color-line-subtle, #EEEFF2); font-size: 13px; }
  .cl-cta-row.head { font-weight: 600; color: var(--color-content-subtle, #4F5663); font-size: 12px; }
  .cl-empty { font-size: 13px; color: var(--color-content-subtle, #4F5663); padding: 8px 0; }
  .cl-btn { border: 1px solid var(--color-line-default, #DEDFE2); background: var(--color-surface-default, #FFFFFF); border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  .cl-btn.primary { background: var(--color-action-primary-default, #9254D9); color: #fff; border-color: transparent; }
  .cl-btn.small { padding: 4px 9px; font-size: 12px; }
  .cl-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .cl-form .full { grid-column: 1 / -1; }
  .cl-form label { display: block; font-size: 12px; color: var(--color-content-subtle, #4F5663); margin-bottom: 3px; }
  .cl-form input, .cl-form select, .cl-form textarea { width: 100%; border: 1px solid var(--color-line-default, #DEDFE2); border-radius: 6px; padding: 6px 8px; font-size: 13px; box-sizing: border-box; }
  .cl-msg { font-size: 13px; margin-top: 10px; padding: 8px 10px; border-radius: 8px; display: none; }
  .cl-msg.ok { display: block; background: #EAF7EE; color: #1E7B3C; }
  .cl-msg.err { display: block; background: #FCEDEC; color: #B3261E; }
  .cl-err-inline { font-size: 12px; color: #B3261E; margin-top: 3px; display: none; }
</style>

<div class="cl-card">
  <div class="cl-head">
    <div>
      <h2 class="cl-company-name">会社名を読み込み中…</h2>
      <p class="cl-csm">CSM: -</p>
    </div>
    <span class="cl-badge">月曜朝会 CL</span>
  </div>

  <div class="cl-section">
    <h3>オープンCTA</h3>
    <div class="cl-cta-row head">
      <span>件名</span><span>期日</span><span>優先度</span><span>ステータス</span><span></span>
    </div>
    <div class="cl-cta-list"><div class="cl-empty">読み込み中…</div></div>
  </div>

  <div class="cl-section">
    <h3>CTA新規登録</h3>
    <div class="cl-form">
      <div class="full">
        <label>件名</label>
        <input class="cl-name" type="text" value="月曜朝会フォローアップ" />
        <p class="cl-err-inline cl-name-err">件名を入力してください</p>
      </div>
      <div>
        <label>ステータス</label>
        <select class="cl-status">
          <option value="1I0017YS8AFRMU863334FXXJFUG3O8G3V3JP">新規</option>
          <option value="1I0017YS8AFRMU863321N90FHHIA8T6R4ZWS">対応中</option>
          <option value="1I0017YS8AFRMU8633LOJEOXFQU6E2ZB1IH1">クローズド　成功</option>
          <option value="1I0017YS8AFRMU86334TQM259A0U3PSZQXRV">クローズド　アクションなし</option>
        </select>
      </div>
      <div>
        <label>優先度</label>
        <select class="cl-priority">
          <option value="1I0016MVH7ECQMT12K5GK8FV85R68VYG337W">高</option>
          <option value="1I0016MVH7ECQMT12KBHUXXVZBKQ07Q363TQ" selected>中</option>
          <option value="1I0016MVH7ECQMT12KB5B2Q1NPFNS2D9WHFS">低</option>
        </select>
      </div>
      <div>
        <label>理由</label>
        <select class="cl-reason">
          <option value="1I003F6D392Y2KJ97AFJAF3N831V8KJEUJGR" selected>その他</option>
          <option value="1I003F6D392Y2KJ97ASTGOFQMT7NA6KA98DV">内部アクティビティ</option>
          <option value="1I003F6D392Y2KJ97APY1S3MF0OV5R2KX8PQ">更新</option>
          <option value="1I003F6D392Y2KJ97A14SN75ZW3WSCHUDZ4L">使用率の低下</option>
          <option value="1I003F6D392Y2KJ97ALJ4PZVY2XQPW3574MN">製品リスク</option>
        </select>
      </div>
      <div>
        <label>期日</label>
        <input class="cl-due" type="date" />
        <p class="cl-err-inline cl-due-err">期日を選択してください</p>
      </div>
      <div class="full">
        <label>概要（任意）</label>
        <textarea class="cl-desc" rows="2" placeholder="朝会での申し送り内容など"></textarea>
      </div>
      <div class="full">
        <button class="cl-btn primary cl-register">CTAを登録</button>
      </div>
    </div>
    <div class="cl-msg cl-form-msg"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
