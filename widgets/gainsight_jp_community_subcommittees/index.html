<style>
  :host {
    display: block;
    font-family: var(--font-family-sans, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif);
  }

  .cards-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: 22px;
    max-width: 1180px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  .cards-row * { box-sizing: border-box; }

  .card {
    position: relative;
    flex: 1 1 190px;
    max-width: 220px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-decoration: none;
    padding-bottom: 26px;
    cursor: pointer;
  }
  .card:hover .icon-blob { transform: scale(1.04); }
  .card:focus-visible {
    outline: 3px solid var(--color-focus-ring, #388bff);
    outline-offset: 4px;
    border-radius: 12px;
  }

  .icon-blob {
    width: 140px;
    height: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 6px;
    transition: transform 0.15s ease;
  }
  .card-icon {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Not rendered — used only so the platform's publish-time asset-path
     rewrite (which only rewrites paths written in static HTML) resolves
     these to hosted URLs; app.js reads back the resolved .href. */
  link[rel="preload"] {
    display: none;
  }

  .card-category {
    font-style: italic;
    font-weight: 700;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 19px;
    color: var(--card-color, #999);
    margin-bottom: 4px;
  }
  .card-title {
    font-weight: 700;
    font-size: 16px;
    line-height: 1.35;
    color: var(--color-content-heading-default, #2B3346);
    margin-bottom: 6px;
  }
  .card-desc {
    font-size: 13px;
    line-height: 1.5;
    color: var(--color-content-subtle, #4F5663);
  }

  .arrow-badge {
    position: absolute;
    right: 8px;
    bottom: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--card-color, #999);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    line-height: 1;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
  }

  @media (max-width: 640px) {
    .card { flex: 1 1 100%; max-width: 360px; }
  }
</style>

<link rel="preload" as="image" href="icons/icon-ai.png" id="icon-src-ai">
<link rel="preload" as="image" href="icons/icon-ops.png" id="icon-src-ops">
<link rel="preload" as="image" href="icons/icon-digital.png" id="icon-src-digital">
<link rel="preload" as="image" href="icons/icon-strategy.png" id="icon-src-strategy">
<link rel="preload" as="image" href="icons/icon-community.png" id="icon-src-community">

<div class="cards-row"></div>

<script type="module" src="app.js"></script>
