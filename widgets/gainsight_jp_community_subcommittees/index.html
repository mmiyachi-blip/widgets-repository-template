<style>
  :host {
    display: block;
    font-family: var(--font-family-sans, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif);
  }

  .wheel-wrap {
    max-width: 680px;
    margin: 0 auto;
  }
  svg.wheel { width: 100%; height: auto; display: block; overflow: visible; }

  .piece { cursor: pointer; }
  .piece-shape {
    fill: var(--color-surface-default, #ffffff);
    stroke-width: 3;
    transition: filter 0.15s ease;
  }
  .piece:hover .piece-shape,
  .piece:focus-visible .piece-shape {
    filter: brightness(0.97);
  }
  .piece:hover .piece-group,
  .piece:focus-visible .piece-group {
    transform: scale(1.035);
  }
  .piece-group {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.15s ease;
  }
  a.piece:focus-visible {
    outline: 3px solid var(--color-focus-ring, #388bff);
    outline-offset: 2px;
  }

  .piece-card {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 3px;
    text-align: center;
    padding-top: 2px;
    box-sizing: border-box;
    overflow: hidden;
    pointer-events: none;
  }
  .piece-icon {
    width: 40px;
    height: 40px;
    fill: none;
    stroke-width: 4.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
    margin-bottom: 2px;
  }
  .piece-category {
    font-style: italic;
    font-weight: 700;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 14px;
    line-height: 1.2;
  }
  .piece-title {
    font-weight: 700;
    font-size: 13px;
    line-height: 1.3;
    color: var(--color-content-heading-default, #2B3346);
  }
  .piece-desc {
    font-size: 11px;
    line-height: 1.3;
    color: var(--color-content-subtle, #4F5663);
  }

  .center-circle {
    fill: var(--color-surface-default, #ffffff);
    stroke: var(--color-line-default, #DEDFE2);
    stroke-width: 2;
  }
  .center-text {
    fill: var(--color-content-heading-default, #2B3346);
    font-weight: 700;
  }
</style>

<div class="wheel-wrap">
  <svg class="wheel" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="分科会一覧">
    <g class="pieces"></g>
    <g class="center"></g>
  </svg>
</div>

<script type="module" src="app.js"></script>
