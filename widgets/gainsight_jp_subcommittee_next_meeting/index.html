<style>
  :host {
    display: block;
    font-family: var(--font-family-sans, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif);
  }

  .nm-card {
    position: relative;
    max-width: 900px;
    margin: 0 auto;
    overflow: hidden;
    background: var(--color-surface-default, #ffffff);
    border: 1px solid var(--color-line-default, #ECEDF0);
    box-shadow: 0 2px 16px rgba(31, 42, 68, 0.06);
    border-radius: 24px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }

  .nm-status {
    display: none;
    text-align: center;
    padding: 32px;
    color: var(--color-content-subtle, #6B7280);
    font-size: 14px;
  }

  .nm-topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(
      90deg,
      color-mix(in srgb, var(--nm-accent, #2F6FED) 24%, white),
      color-mix(in srgb, var(--nm-accent, #2F6FED) 10%, white)
    );
    padding: 12px 24px;
  }

  .nm-heading-icon {
    font-size: 16px;
    line-height: 1;
  }

  .nm-heading-text {
    font-size: 14px;
    font-weight: 700;
    color: color-mix(in srgb, var(--nm-accent, #2F6FED) 70%, #1F2A44);
  }

  .nm-body {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 24px 28px;
    flex-wrap: wrap;
  }

  /* Found state */
  .nm-found-state {
    display: flex;
    align-items: center;
    gap: 20px;
    flex: 1 1 260px;
    min-width: 0;
  }

  .nm-datebox {
    flex: 0 0 auto;
    min-width: 88px;
    background: var(--color-surface-subtle, #F7F7F9);
    border-radius: 14px;
    padding: 12px 14px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .nm-year {
    font-size: 12px;
    font-weight: 600;
    color: var(--color-content-subtle, #6B7280);
  }

  .nm-date {
    font-size: 26px;
    font-weight: 800;
    color: var(--nm-accent, #2F6FED);
    line-height: 1.2;
  }

  .nm-weekday {
    font-size: 12px;
    font-weight: 600;
    color: var(--color-content-subtle, #6B7280);
  }

  .nm-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    min-width: 0;
  }

  .nm-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    font-weight: 700;
    color: var(--nm-accent, #2F6FED);
    background: color-mix(in srgb, var(--nm-accent, #2F6FED) 14%, white);
    border-radius: 999px;
    padding: 4px 12px;
  }

  .nm-time-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 18px;
    font-weight: 700;
    color: #1F2A44;
  }

  .nm-time-row svg {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    stroke: var(--color-content-subtle, #6B7280);
    fill: none;
  }

  /* Empty state */
  .nm-empty-state {
    flex: 1 1 260px;
    min-width: 0;
    text-align: left;
  }

  .nm-empty-headline {
    font-size: 17px;
    font-weight: 800;
    color: #1F2A44;
    line-height: 1.4;
    margin: 0 0 4px;
  }

  .nm-empty-headline mark {
    background: linear-gradient(transparent 60%, #FFE49A 60%);
    color: inherit;
  }

  .nm-empty-submessage {
    font-size: 13px;
    color: #4F5663;
    margin: 0 0 12px;
  }

  .nm-subscribe-notice {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: var(--color-surface-subtle, #F7F7F9);
    border-radius: 14px;
    padding: 10px 14px;
  }

  .nm-subscribe-icon {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--nm-accent, #2F6FED);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nm-subscribe-icon svg {
    width: 13px;
    height: 13px;
    stroke: #ffffff;
    fill: none;
  }

  .nm-subscribe-text {
    font-size: 13px;
    font-weight: 600;
    color: #1F2A44;
    line-height: 1.5;
  }

  .nm-illustration {
    flex: 0 0 auto;
    width: 180px;
    max-width: 40%;
  }

  .nm-illustration img {
    width: 100%;
    height: auto;
    display: block;
  }

  .nm-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0 28px 24px;
    background: var(--nm-accent, #2F6FED);
    color: #ffffff;
    border: none;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    border-radius: 999px;
    padding: 12px 24px;
    box-sizing: border-box;
  }

  .nm-link:hover {
    filter: brightness(0.94);
  }

  /* Not rendered — used only so the platform's publish-time asset-path
     rewrite (which only rewrites paths written in static HTML) resolves
     these to hosted URLs; app.js reads back the resolved .href. */
  link[rel="preload"] {
    display: none;
  }

  @media (max-width: 560px) {
    .nm-body { flex-direction: column; align-items: stretch; }
    .nm-found-state { flex-wrap: wrap; }
    .nm-illustration { width: 140px; max-width: 50%; margin: 0 auto; }
  }
</style>

<link rel="preload" as="image" href="assets/mascot-ai.png" id="mascot-src-ai">
<link rel="preload" as="image" href="assets/mascot-ops.png" id="mascot-src-ops">
<link rel="preload" as="image" href="assets/mascot-digital.png" id="mascot-src-digital">
<link rel="preload" as="image" href="assets/mascot-strategy.png" id="mascot-src-strategy">
<link rel="preload" as="image" href="assets/mascot-community.png" id="mascot-src-community">

  <div class="nm-topbar">
    <span class="nm-heading-icon">👑</span>

  <div class="nm-body">
    <div class="nm-found-state">
      <div class="nm-datebox">
        <span class="nm-year"></span>

      <div class="nm-meta">
        <span class="nm-badge nm-location-text"></span>
        <div class="nm-time-row">
          <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <polyline points="12 7 12 12 16 14"></polyline>
          </svg>
          <span class="nm-time-text"></span>
        </div>

    <div class="nm-empty-state">
      <p class="nm-empty-headline"></p>
      <p class="nm-empty-submessage"></p>
      <div class="nm-subscribe-notice">
        <span class="nm-subscribe-icon">
          <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </span>
        <span class="nm-subscribe-text"></span>
      </div>
    </div>

    <div class="nm-illustration">
      <img class="nm-mascot" src="" alt="" />

  </div>

  <a class="nm-link" href="#" target="_blank" rel="noopener noreferrer">
    <span class="nm-link-text"></span>
    <span>›</span>
  </a>
</div>

<script type="module" src="app.js"></script>
