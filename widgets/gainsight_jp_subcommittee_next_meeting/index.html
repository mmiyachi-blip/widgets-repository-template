<style>
  :host {
    display: block;
    font-family: var(--font-family-sans, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif);
  }

  .nm-wrap {
    max-width: 900px;
    margin: 0 auto;
  }

  .nm-heading-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(90deg, #FFF3D6, #FFE8B8);
    border-radius: 14px 14px 0 0;
    padding: 10px 20px;
  }

  .nm-heading-icon {
    font-size: 18px;
    line-height: 1;
  }

  .nm-heading {
    font-size: 14px;
    font-weight: 700;
    color: #7A5B12;
    margin: 0;
  }

  .nm-status {
    display: none;
    padding: 20px;
    text-align: center;
    font-size: 14px;
    color: var(--color-content-subtle, #6B7280);
    background: var(--color-surface-default, #ffffff);
    border: 1px solid var(--color-line-default, #DEDFE2);
    border-top: none;
    border-radius: 0 0 14px 14px;
  }

  .nm-card {
    display: flex;
    align-items: stretch;
    gap: 20px;
    background: var(--color-surface-default, #ffffff);
    border: 1px solid var(--color-line-default, #DEDFE2);
    border-top: none;
    border-radius: 0 0 14px 14px;
    padding: 20px;
    box-sizing: border-box;
    flex-wrap: wrap;
  }

  .nm-datebox {
    flex: 0 0 auto;
    min-width: 96px;
    background: var(--color-surface-subtle, #F7F7F9);
    border-radius: 12px;
    padding: 12px 16px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .nm-year {
    font-size: 12px;
    color: var(--color-content-subtle, #6B7280);
    font-weight: 600;
  }

  .nm-date {
    font-size: 24px;
    font-weight: 800;
    color: var(--nm-accent, #F2A33C);
    line-height: 1.2;
  }

  .nm-weekday {
    font-size: 12px;
    font-weight: 600;
    color: var(--color-content-subtle, #6B7280);
  }

  .nm-body {
    flex: 1 1 260px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .nm-badge {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--nm-accent, #F2A33C);
    background: color-mix(in srgb, var(--nm-accent, #F2A33C) 14%, white);
    border-radius: 999px;
    padding: 3px 10px;
  }

  .nm-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--color-content-default, #1F3B57);
    overflow-wrap: anywhere;
    margin: 0;
  }

  .nm-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--color-content-subtle, #6B7280);
  }

  .nm-excerpt {
    font-size: 13px;
    line-height: 1.6;
    color: var(--color-content-default, #2B3346);
    overflow-wrap: anywhere;
  }

  .nm-link {
    align-self: flex-start;
    margin-top: 4px;
    display: inline-block;
    background: var(--nm-accent, #F2A33C);
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    border-radius: 999px;
    padding: 9px 22px;
  }

  .nm-link:hover {
    filter: brightness(0.95);
  }

  @media (max-width: 560px) {
    .nm-card { flex-direction: column; align-items: flex-start; }
    .nm-datebox { flex-direction: row; gap: 8px; align-items: baseline; }
  }
</style>

<div class="nm-wrap">
  <div class="nm-heading-row">
    <span class="nm-heading-icon">👑</span>
    <p class="nm-heading"></p>
  </div>
  <div class="nm-status"></div>
  <div class="nm-card">
    <div class="nm-datebox">
      <span class="nm-year"></span>
      <span class="nm-date"></span>
      <span class="nm-weekday"></span>
    </div>
    <div class="nm-body">
      <span class="nm-badge"></span>
      <p class="nm-title"></p>
      <div class="nm-meta">
        <span class="nm-time"></span>
      </div>
      <p class="nm-excerpt"></p>
      <a class="nm-link" href="#" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
