<style>
  :host {
    display: block;
    font-family: var(--font-family-sans, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif);
  }

  .nm-card {
    position: relative;
    max-width: 440px;
    margin: 0 auto;
    overflow: hidden;
    background: var(--color-surface-default, #ffffff);
    border: 1px solid var(--color-line-default, #ECEDF0);
    box-shadow: 0 2px 16px rgba(31, 42, 68, 0.06);
    border-radius: 32px;
    padding: 36px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .nm-status {
    display: none;
    text-align: center;
    padding: 32px;
    color: var(--color-content-subtle, #6B7280);
    font-size: 14px;
  }

  .nm-top {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .nm-main {
    width: 100%;
    min-width: 0;
    position: relative;
    z-index: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .nm-heading-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .nm-heading-icon {
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(47, 111, 237, 0.18);
  }

  .nm-heading-icon svg {
    width: 24px;
    height: 24px;
    stroke: var(--nm-accent, #2F6FED);
  }

  .nm-heading {
    font-size: 21px;
    font-weight: 800;
    color: #1F2A44;
    margin: 0;
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .nm-heading .nm-subcommittee-name {
    color: var(--nm-accent, #2F6FED);
  }

  .nm-spark {
    color: #FFC94A;
    font-size: 18px;
  }

  /* Found state */
  .nm-rows {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .nm-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .nm-row-icon {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nm-row-icon svg {
    width: 16px;
    height: 16px;
    stroke: #ffffff;
    fill: none;
  }

  .nm-row-date .nm-row-icon { background: var(--nm-accent, #2F6FED); }
  .nm-row-time .nm-row-icon { background: #8B7CF0; }
  .nm-row-location .nm-row-icon { background: #2BC2C2; }

  .nm-row-text {
    font-size: 15px;
    font-weight: 700;
    color: #1F2A44;
    background: var(--color-surface-subtle, #F7F7F9);
    border-radius: 999px;
    padding: 6px 16px;
  }

  /* Empty state */
  .nm-empty-headline {
    font-size: 17px;
    font-weight: 800;
    color: #1F2A44;
    line-height: 1.4;
    margin: 0 0 4px;
  }

  .nm-empty-headline mark {
    background: linear-gradient(transparent 60%, #FFE49A 60%);
    color: inherit;
  }

  .nm-empty-submessage {
    font-size: 13px;
    color: #4F5663;
    margin: 0 0 12px;
  }

  .nm-subscribe-notice {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: var(--color-surface-subtle, #F7F7F9);
    border-radius: 14px;
    padding: 10px 16px;
  }

  .nm-subscribe-icon {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--nm-accent, #2F6FED);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nm-subscribe-icon svg {
    width: 13px;
    height: 13px;
    stroke: #ffffff;
    fill: none;
  }

  .nm-subscribe-text {
    font-size: 13px;
    font-weight: 600;
    color: #1F2A44;
    line-height: 1.5;
  }

  .nm-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: var(--nm-accent, #2F6FED);
    color: #ffffff;
    border: none;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    border-radius: 999px;
    padding: 12px 24px;
    box-sizing: border-box;
  }

  .nm-link:hover {
    filter: brightness(0.94);
  }

  .nm-illustration {
    flex: 0 0 auto;
    width: 150px;
    max-width: 50%;
    order: -1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .nm-illustration img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Not rendered — used only so the platform's publish-time asset-path
     rewrite (which only rewrites paths written in static HTML) resolves
     these to hosted URLs; app.js reads back the resolved .href. */
  link[rel="preload"] {
    display: none;
  }

  @media (max-width: 360px) {
    .nm-card { padding: 24px; }
  }
</style>

<link rel="preload" as="image" href="assets/mascot-ai.png" id="mascot-src-ai">
<link rel="preload" as="image" href="assets/mascot-ops.png" id="mascot-src-ops">
<link rel="preload" as="image" href="assets/mascot-digital.png" id="mascot-src-digital">
<link rel="preload" as="image" href="assets/mascot-strategy.png" id="mascot-src-strategy">
<link rel="preload" as="image" href="assets/mascot-community.png" id="mascot-src-community">

    <div class="nm-illustration">

  </div>

  <a class="nm-link" href="#" target="_blank" rel="noopener noreferrer">
    <span class="nm-link-text"></span>
    <span>›</span>

</div>

<script type="module" src="app.js"></script>
