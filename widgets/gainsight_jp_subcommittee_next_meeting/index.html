<style>
  :host {
    display: block;
    font-family: var(--font-family-sans, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif);
  }

  .nm-card {
    position: relative;
    max-width: 1000px;
    margin: 0 auto;
    overflow: hidden;
    background: var(--color-surface-default, #ffffff);
    border: 1px solid var(--color-line-default, #ECEDF0);
    box-shadow: 0 2px 16px rgba(31, 42, 68, 0.06);
    border-radius: 32px;
    padding: 36px 48px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .nm-status {
    display: none;
    text-align: center;
    padding: 32px;
    color: var(--color-content-subtle, #6B7280);
    font-size: 14px;
  }

  .nm-main {
    flex: 1 1 380px;
    min-width: 0;
    position: relative;
    z-index: 1;
  }

  .nm-heading-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .nm-heading-icon {
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(47, 111, 237, 0.18);
  }

  .nm-heading-icon svg {
    width: 24px;
    height: 24px;
    stroke: var(--nm-accent, #2F6FED);
  }

  .nm-heading {
    font-size: 26px;
    font-weight: 800;
    color: #1F2A44;
    margin: 0;
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .nm-heading .nm-subcommittee-name {
    color: var(--nm-accent, #2F6FED);
  }

  .nm-spark {
    color: #FFC94A;
    font-size: 18px;
  }

  /* Found state */
  .nm-rows {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 26px;
  }

  .nm-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .nm-row-icon {
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nm-row-icon svg {
    width: 18px;
    height: 18px;
    stroke: #ffffff;
    fill: none;
  }

  .nm-row-date .nm-row-icon { background: var(--nm-accent, #2F6FED); }
  .nm-row-time .nm-row-icon { background: #8B7CF0; }
  .nm-row-location .nm-row-icon { background: #2BC2C2; }

  .nm-row-text {
    font-size: 19px;
    font-weight: 700;
    color: #1F2A44;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 999px;
    padding: 8px 20px;
  }

  /* Empty state */
  .nm-empty-headline {
    font-size: 21px;
    font-weight: 800;
    color: #1F2A44;
    line-height: 1.5;
    margin: 0 0 8px;
  }

  .nm-empty-headline mark {
    background: linear-gradient(transparent 60%, #FFE49A 60%);
    color: inherit;
  }

  .nm-empty-submessage {
    font-size: 15px;
    color: #4F5663;
    margin: 0 0 20px;
  }

  .nm-subscribe-notice {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: rgba(255, 255, 255, 0.7);
    border-radius: 16px;
    padding: 14px 18px;
    margin-bottom: 26px;
  }

  .nm-subscribe-icon {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--nm-accent, #2F6FED);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nm-subscribe-icon svg {
    width: 16px;
    height: 16px;
    stroke: #ffffff;
    fill: none;
  }

  .nm-subscribe-text {
    font-size: 14px;
    font-weight: 600;
    color: #1F2A44;
    line-height: 1.6;
  }

  .nm-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #ffffff;
    color: var(--nm-accent, #2F6FED);
    border: 2px solid var(--nm-accent, #2F6FED);
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    border-radius: 999px;
    padding: 12px 28px;
  }

  .nm-link:hover {
    background: var(--nm-accent, #2F6FED);
    color: #ffffff;
  }

  .nm-illustration {
    flex: 0 0 auto;
    width: 480px;
    max-width: 56%;
    margin: -56px -88px -56px -20px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .nm-illustration img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Not rendered — used only so the platform's publish-time asset-path
     rewrite (which only rewrites paths written in static HTML) resolves
     these to hosted URLs; app.js reads back the resolved .href. */
  link[rel="preload"] {
    display: none;
  }

  @media (max-width: 680px) {
    .nm-card {
      border-radius: 32px;
      padding: 28px;
      flex-direction: column;
      align-items: stretch;
    }
    .nm-illustration {
      max-width: 60%;
      margin: 0 auto;
      order: -1;
    }
    .nm-row-text { font-size: 16px; }
  }
</style>

<link rel="preload" as="image" href="assets/mascot-ai.png" id="mascot-src-ai">
<link rel="preload" as="image" href="assets/mascot-ops.png" id="mascot-src-ops">
<link rel="preload" as="image" href="assets/mascot-digital.png" id="mascot-src-digital">
<link rel="preload" as="image" href="assets/mascot-strategy.png" id="mascot-src-strategy">
<link rel="preload" as="image" href="assets/mascot-community.png" id="mascot-src-community">

<div class="nm-card">
  <div class="nm-status"></div>

  <div class="nm-main">
    <div class="nm-heading-row">
      <span class="nm-heading-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>

          <line x1="3" y1="10" x2="21" y2="10"></line>

      <h3 class="nm-heading">次回の<span class="nm-subcommittee-name"></span><span class="nm-spark">✦</span></h3>

    <div class="nm-found-state">
      <div class="nm-rows">
        <div class="nm-row nm-row-date">
          <span class="nm-row-icon">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </span>
          <span class="nm-row-text nm-date-text"></span>
        </div>
        <div class="nm-row nm-row-time">
          <span class="nm-row-icon">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <polyline points="12 7 12 12 16 14"></polyline>
            </svg>
          </span>
          <span class="nm-row-text nm-time-text"></span>

        <div class="nm-row nm-row-location">
          <span class="nm-row-icon">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <div class="nm-empty-state">

      <div class="nm-subscribe-notice">

        <span class="nm-subscribe-text"></span>
      </div>
    </div>

    <a class="nm-link" href="#" target="_blank" rel="noopener noreferrer">
      <span class="nm-link-text"></span>
      <span>›</span>
    </a>
  </div>

  <div class="nm-illustration">
    <img class="nm-mascot" src="" alt="" />
  </div>
</div>

<script type="module" src="app.js"></script>
