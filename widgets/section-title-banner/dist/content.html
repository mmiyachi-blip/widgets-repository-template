<style>
  :host {
    display: block;
    font-family: var(--font-family-sans, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif);
  }

  .stb {
    --title-color: #1F2A44;
    --hl-color: #2F8CF0;
    --btn-color: #2F8CF0;
    --deco-color: #3D9BF5;
    --title-size: 40px;
    --sub-color: #1F2A44;
    --sub-size: 18px;
    position: relative;
    box-sizing: border-box;
    width: 100%;
    padding: 28px 16px 24px;
    overflow: hidden;
    text-align: center;
  }

  .stb * {
    box-sizing: border-box;
  }

  .stb-deco {
    position: absolute;
    top: 50%;
    width: min(26%, 340px);
    height: auto;
    transform: translateY(-50%);
    color: var(--deco-color);
    pointer-events: none;
  }

  .stb-deco-left {
    left: 2%;
  }

  .stb-deco-right {
    right: 2%;
    transform: translateY(-50%) scaleX(-1);
  }

  .stb-deco svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  .stb-main {
    position: relative;
    z-index: 1;
    display: inline-block;
    max-width: 100%;
  }

  .stb-burst {
    position: absolute;
    top: -14px;
    width: 52px;
    height: 36px;
    color: var(--deco-color);
    pointer-events: none;
  }

  .stb-burst-left {
    left: -52px;
  }

  .stb-burst-right {
    right: -52px;
    transform: scaleX(-1);
  }

  .stb-title {
    margin: 0;
    font-size: var(--title-size);
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: 0.02em;
    color: var(--title-color);
  }

  .stb-line {
    display: block;
  }

  .stb-hl {
    color: var(--hl-color);
  }

  .stb-subtitle {
    margin: 12px 0 0;
    font-size: var(--sub-size);
    font-weight: 400;
    line-height: 1.6;
    letter-spacing: 0.02em;
    color: var(--sub-color);
  }

  .stb-sub-line {
    display: block;
  }

  .stb-subtitle .stb-hl {
    font-weight: inherit;
  }

  .stb-btn-wrap {
    margin-top: 16px;
  }

  .stb-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    max-width: 100%;
    padding: 9px 24px 9px 18px;
    border: 1.5px solid color-mix(in srgb, var(--btn-color) 28%, #ffffff);
    border-radius: 999px;
    background: #ffffff;
    color: var(--title-color);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 2px 8px rgba(40, 80, 140, 0.08);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .stb-btn:hover {
    transform: translateY(-1px);
    border-color: var(--btn-color);
    box-shadow: 0 4px 12px rgba(40, 80, 140, 0.16);
  }

  .stb-btn:focus-visible {
    outline: 2px solid var(--btn-color);
    outline-offset: 2px;
  }

  .stb-btn-icon {
    font-size: 18px;
    line-height: 1;
  }

  .stb-btn-arrow {
    flex: none;
    width: 20px;
    height: 20px;
    color: var(--btn-color);
  }

  [hidden] {
    display: none !important;
  }

  @media (max-width: 900px) {
    .stb-deco {
      opacity: 0.55;
      width: 22%;
    }
  }

  @media (max-width: 640px) {
    .stb {
      padding: 20px 12px 18px;
    }

    .stb-deco,
    .stb-burst {
      display: none;
    }

    .stb-title {
      font-size: calc(var(--title-size) * 0.65);
    }

    .stb-subtitle {
      font-size: calc(var(--sub-size) * 0.8);
    }

    .stb-btn {
      font-size: 13px;
      padding: 8px 18px 8px 14px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .stb-btn {
      transition: none;
    }
  }
</style>

<div class="stb">
  <div class="stb-deco stb-deco-left" aria-hidden="true"></div>
  <div class="stb-deco stb-deco-right" aria-hidden="true"></div>

  <div class="stb-main">
    <svg class="stb-burst stb-burst-left" viewBox="0 0 52 36" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
        <line x1="30" y1="4" x2="38" y2="20" opacity="0.9" />
        <line x1="8" y1="24" x2="22" y2="31" opacity="0.5" />
      </g>
    </svg>
    <svg class="stb-burst stb-burst-right" viewBox="0 0 52 36" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
        <line x1="30" y1="4" x2="38" y2="20" opacity="0.9" />
        <line x1="8" y1="24" x2="22" y2="31" opacity="0.5" />
      </g>
    </svg>

    <h2 class="stb-title">
      <span class="stb-line stb-line1"></span>
      <span class="stb-line stb-line2"></span>
    </h2>

    <p class="stb-subtitle" hidden>
      <span class="stb-sub-line stb-sub-line1"></span>
      <span class="stb-sub-line stb-sub-line2"></span>
    </p>

    <div class="stb-btn-wrap">
      <a class="stb-btn" href="#">
        <span class="stb-btn-icon" aria-hidden="true"></span>
        <span class="stb-btn-text"></span>
        <svg class="stb-btn-arrow" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 10h13M11 4.5 16.5 10 11 15.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
