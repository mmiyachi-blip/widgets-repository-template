<style>:host {
    display: block;
    font-family: var(--font-family-sans, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif);
    --accent: #559CF9;
    --ink: #1f3a5f;
    --muted: #6b7686;
    --line: #dfe3ea;
    --chip-bg: #eef4ff;
  }.hk * { box-sizing: border-box; }.hk { max-width: 1200px; margin: 0 auto; color: var(--ink); }.hk .hk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 20px; }.hk .hk-count { font-size: 18px; color: var(--muted); margin-right: auto; }.hk .hk-count b { color: var(--ink); font-weight: 700; }.hk .hk-search,
  .hk select {
    height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px;
    font: inherit; font-size: 14px; background: #fff; color: var(--ink);
  }.hk .hk-search { width: 220px; }.hk .hk-btn {
    height: 40px; border: 0; border-radius: 8px; padding: 0 18px; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 700; color: #fff; background: var(--accent);
  }.hk .hk-btn:hover { filter: brightness(0.95); }.hk .hk-btn.hk-ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }.hk .hk-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }.hk .hk-tab {
    border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 999px;
    padding: 6px 16px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }.hk .hk-tab.hk-on { background: var(--accent); border-color: var(--accent); color: #fff; }.hk .hk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }.hk .hk-card {
    display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line);
    border-radius: 16px; padding: 24px; cursor: pointer; transition: box-shadow .15s;
  }.hk .hk-card:hover { box-shadow: 0 6px 20px rgba(31, 58, 95, .10); }.hk .hk-title { font-size: 18px; font-weight: 800; line-height: 1.5; margin: 0 0 10px; }.hk .hk-badge {
    display: inline-block; background: #f07a2f; color: #fff; font-size: 12px; font-weight: 800;
    letter-spacing: .04em; border-radius: 999px; padding: 2px 10px; margin-right: 8px; vertical-align: 2px;
  }.hk .hk-badge.hk-skill { background: #7c5cfc; }.hk .hk-desc {
    color: var(--muted); font-size: 14px; line-height: 1.8; margin: 0 0 16px; flex: 1;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }.hk .hk-chip {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
    background: #f7f8fb; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; margin: 0 6px 8px 0;
  }.hk .hk-chip.hk-tag { background: var(--chip-bg); border-color: #dbe7fd; color: var(--accent); font-size: 12px; }.hk .hk-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); display: inline-block; }.hk .hk-meta { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 12px; margin: 4px 0 14px; }.hk .hk-like {
    border: 0; background: none; cursor: pointer; font: inherit; font-size: 13px; color: var(--muted);
    display: inline-flex; align-items: center; gap: 4px; padding: 0;
  }.hk .hk-like.hk-on { color: #ee4266; font-weight: 700; }.hk .hk-actions { display: flex; gap: 8px; }.hk .hk-actions .hk-btn { flex: 1; }.hk .hk-empty { text-align: center; color: var(--muted); padding: 60px 0; }.hk .hk-overlay {
    position: fixed; inset: 0; background: rgba(15, 25, 45, .5); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 9999;
  }.hk .hk-overlay.hk-open { display: flex; }.hk .hk-modal {
    background: #fff; border-radius: 16px; width: 100%; max-width: 640px; max-height: 90vh;
    overflow: auto; padding: 28px; position: relative;
  }.hk .hk-modal h2 { margin: 0 0 16px; font-size: 20px; }.hk .hk-x { position: absolute; top: 12px; right: 16px; border: 0; background: none; font-size: 24px; cursor: pointer; color: var(--muted); }.hk label { display: block; font-size: 13px; font-weight: 700; margin: 14px 0 6px; }.hk label small { font-weight: 400; color: var(--muted); }.hk input[type=text],
  .hk textarea,
  .hk .hk-modal select {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 14px; color: var(--ink);
  }.hk textarea { min-height: 160px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }.hk .hk-warn { background: #fff7e6; border: 1px solid #ffe0a3; border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.7; margin-top: 14px; }.hk .hk-err { color: #d6336c; font-size: 12px; margin-top: 8px; min-height: 16px; }.hk pre.hk-body {
    background: #f7f8fb; border: 1px solid var(--line); border-radius: 8px; padding: 14px;
    white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.7; max-height: 320px; overflow: auto;
  }.hk .hk-toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); background: #1f3a5f; color: #fff;
    padding: 10px 20px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10000;
  }.hk .hk-toast.hk-show { opacity: 1; }

  .hk .hk-search { width: 220px !important; flex: 0 0 220px; display: block; }
  .hk .hk-bar select.hk-sort { width: auto !important; }
  .hk .hk-badge { white-space: nowrap; word-break: keep-all; overflow-wrap: normal; width: auto !important; }
  .hk .hk-btn { width: auto; }
  .hk .hk-tab, .hk .hk-like, .hk .x, .hk .hk-x { width: auto !important; }
  .hk .hk-meta { flex-wrap: wrap; }
  .hk .hk-actions .hk-btn { flex: 1; }
</style>

<div class="hk">
  <div class="hk-bar">
    <div class="hk-count"></div>
    <input class="hk-search" type="search" placeholder="キーワードで検索">
    <select class="hk-sort">
      <option value="new">新着順</option>
      <option value="likes">いいね順</option>
      <option value="dl">ダウンロード順</option>
    </select>
    <button class="hk-btn" data-act="open-post">＋ 投稿する</button>
  </div>
  <div class="hk-tabs"></div>
  <div class="hk-grid"></div>

<div class="hk-overlay" data-ov="detail"><div class="hk-modal"><button class="hk-x" data-act="close">×</button><div class="hk-detail"></div></div></div>

<div class="hk-overlay" data-ov="post">
  <div class="hk-modal">
    <button class="hk-x" data-act="close">×</button>
    <h2>Skill・プロンプトを投稿する</h2>
    <label>種別</label>
    <select name="type"><option value="prompt">プロンプト</option><option value="skill">Skill (SKILL.md)</option></select>
    <label>タイトル</label>
    <input type="text" name="title" maxlength="60" placeholder="例: アカウントサマリー">
    <label>概要 <small>(カードに表示。100文字程度)</small></label>
    <input type="text" name="desc" maxlength="120">
    <label>対象ツール</label>
    <select name="tool"><option>Gainsight MCP</option><option>Staircase AI</option><option>Gainsight MCP + Staircase AI</option><option>その他</option></select>
    <label>タグ <small>(カンマ区切り・最大3つ)</small></label>
    <input type="text" name="tags" placeholder="アカウントヘルス, 更新">
    <label>本文 <small>(プロンプト本文、または SKILL.md の全文)</small></label>
    <textarea name="body"></textarea>
    <div class="hk-warn">⚠️ 顧客名・顧客データ・認証情報・社外秘情報は含めないでください。投稿は運営の確認後に公開されます。</div>
    <div class="hk-err"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
      <button class="hk-btn hk-ghost" data-act="close">キャンセル</button>
      <button class="hk-btn" data-act="submit-post">投稿する</button>
    </div>
  </div>
</div>

<div class="hk-toast"></div>
</div>

<script type="module" src="app.js"></script>
