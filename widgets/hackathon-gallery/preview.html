<!doctype html>
<meta charset="utf-8">
<title>Hackathon Gallery preview</title>
<body style="margin:0;padding:32px;background:#fff">
<div id="host"></div>
<script type="module">
  // ローカル確認用: content.html を Shadow DOM に流し込み、SDK をスタブして init を呼ぶ
  const html = await (await fetch('./dist/content.html')).text()
  const root = document.getElementById('host').attachShadow({ mode: 'open' })
  // HOSTILE: 本番ではテーマCSSがShadow DOM内に差し込まれるため、衝突を再現する
  if (location.search.includes('theme')) {
    const t = document.createElement('style')
    t.textContent = 'input,select,textarea{width:100%;display:block;height:48px} button{width:100%;border:2px solid #123} .badge{width:45px;height:40px;border-radius:50%;word-break:break-all} .btn,.card,.title,.tab{all:unset;display:block}'
    root.appendChild(t)
  }
  const tpl = document.createElement('template')
  tpl.innerHTML = html.replace(/<script[\s\S]*?<\/script>/, '')
  root.appendChild(tpl.content)
  const sdk = {
    whenReady: async () => {}, getContainer: () => root, getProps: () => ({ data_source: 'mock' }),
    on: () => () => {}, $: (s) => root.querySelector(s), $$: (s) => root.querySelectorAll(s),
  }
  const { init } = await import('./dist/app.js')
  await init(sdk)
</script>
