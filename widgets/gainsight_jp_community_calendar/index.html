<style>
  :host {
    display: block;
    font-family: var(--font-family-sans, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif);
  }

  .cal-wrap {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--color-surface-default, #ffffff);
    border: 1px solid var(--color-line-default, #DEDFE2);
    border-radius: 20px;
    padding: 32px;
    box-sizing: border-box;
  }

  .cal-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--color-content-default, #1F3B57);
    margin: 0 0 16px;
  }

  .cal-title:empty {
    display: none;
  }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .cal-month-label {
    font-size: 20px;
    font-weight: 700;
    color: var(--color-content-default, #2B3346);
  }

  .cal-nav {
    display: flex;
    gap: 8px;
  }

  .cal-nav button {
    border: none;
    background: var(--w-nav, var(--w-accent, #F2789F));
    color: #ffffff;
    border-radius: 999px;
    padding: 7px 16px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
  }

  .cal-nav button:hover {
    filter: brightness(0.95);
  }

  .cal-status {
    display: none;
    text-align: center;
    padding: 14px;
    color: var(--color-content-subtle, #6B7280);
    font-size: 14px;
  }

  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--color-content-subtle, #6B7280);
    margin-bottom: 6px;
  }

  .cal-weekdays span:first-child { color: #E4574C; }
  .cal-weekdays span:last-child { color: #3E8ED0; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }

  .cal-cell {
    min-height: 96px;
    background: var(--color-surface-subtle, #F7F7F9);
    border-radius: 12px;
    padding: 8px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .cal-cell--empty {
    background: transparent;
  }

  .cal-cell--today {
    background: var(--w-accent-soft, #FCE7EF);
    border: 1px solid var(--w-accent, #F2789F);
  }

  .cal-date {
    font-size: 15px;
    font-weight: 700;
    color: var(--color-content-default, #2B3346);
  }

  .cal-badges {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .cal-badge {
    display: flex;
    align-items: flex-start;
    gap: 5px;
    font-size: 15px;
    line-height: 1.3;
    color: #ffffff;
    border-radius: 8px;
    padding: 4px 7px;
    text-decoration: none;
  }

  .cal-badge-icon {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    line-height: 1;
    margin-top: 1px;
  }

  .cal-badge-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 3px;
    display: block;
  }

  .cal-badge-text {
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow-wrap: anywhere;
  }

  .cal-more {
    font-size: 13px;
    color: var(--color-content-subtle, #6B7280);
  }

  .cal-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--color-line-default, #DEDFE2);
  }

  .cal-legend-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: var(--color-content-default, #2B3346);
    background: var(--color-surface-subtle, #F7F7F9);
    border-radius: 999px;
    padding: 5px 12px 5px 6px;
  }

  .cal-legend-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    flex: 0 0 auto;
  }

  .cal-legend-dot img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 50%;
  }

  /* Compact ("petit") mode: date numbers + tiny color marks only, no
     illustrated badges/legend, for sitting in a narrow sidebar column. */
  .cal-wrap.cal-compact {
    max-width: 360px;
    padding: 16px;
    border-radius: 14px;
  }

  .cal-compact .cal-title { font-size: 13px; margin-bottom: 8px; }
  .cal-compact .cal-month-label { font-size: 14px; }
  .cal-compact .cal-nav button { padding: 4px 10px; font-size: 11px; }
  .cal-compact .cal-weekdays { font-size: 10px; margin-bottom: 3px; }
  .cal-compact .cal-grid { gap: 3px; }

  .cal-compact .cal-cell {
    min-height: 32px;
    padding: 3px;
    border-radius: 6px;
    gap: 2px;
  }

  .cal-compact .cal-date { font-size: 10px; }

  .cal-compact .cal-badges {
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: 2px;
  }

  .cal-compact .cal-badge {
    width: 6px;
    height: 6px;
    min-width: 0;
    padding: 0;
    border-radius: 50%;
    overflow: hidden;
  }

  .cal-compact .cal-badge-icon,
  .cal-compact .cal-badge-text {
    display: none;
  }

  .cal-compact .cal-more,
  .cal-compact .cal-legend {
    display: none;
  }

  @media (max-width: 720px) {
    .cal-wrap { padding: 16px; }
    .cal-month-label { font-size: 17px; }
    .cal-cell { min-height: 72px; padding: 5px; }
    .cal-date { font-size: 13px; }
    .cal-badge { font-size: 12px; padding: 3px 6px; }
    .cal-badge-icon { width: 13px; height: 13px; font-size: 11px; }
  }

  .cal-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(32, 33, 36, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    z-index: 1000;
  }

  .cal-modal-overlay[hidden] {
    display: none;
  }

  .cal-modal {
    position: relative;
    background: var(--color-surface-default, #ffffff);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    max-width: 420px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 24px;
    box-sizing: border-box;
  }

  .cal-modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    border: none;
    background: transparent;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    color: var(--color-content-subtle, #6B7280);
    padding: 4px;
  }

  .cal-modal-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding-right: 24px;
    margin-bottom: 10px;
  }

  .cal-modal-dot {
    flex: 0 0 auto;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    margin-top: 6px;
  }

  .cal-modal-title {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    color: var(--color-content-default, #2B3346);
    overflow-wrap: anywhere;
  }

  .cal-modal-datetime {
    font-size: 14px;
    color: var(--color-content-subtle, #6B7280);
    margin-bottom: 16px;
    padding-left: 24px;
  }

  .cal-modal-description {
    font-size: 14px;
    line-height: 1.6;
    color: var(--color-content-default, #2B3346);
    padding-left: 24px;
    padding-bottom: 16px;
    overflow-wrap: anywhere;
    white-space: pre-line;
  }

  .cal-modal-description a {
    color: var(--w-accent, #F2789F);
  }

  .cal-modal-footer {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    padding-left: 24px;
    border-top: 1px solid var(--color-line-default, #DEDFE2);
    padding-top: 14px;
  }

  .cal-modal-link {
    font-size: 14px;
    font-weight: 600;
    color: var(--w-accent, #F2789F);
    text-decoration: none;
  }

  .cal-modal-link:hover {
    text-decoration: underline;
  }
</style>

<div class="cal-wrap">
  <div class="cal-title"></div>
  <div class="cal-header">
    <div class="cal-month-label"></div>
    <div class="cal-nav">
      <button class="cal-prev" type="button">&lt; 前月</button>
      <button class="cal-today" type="button">今日</button>
      <button class="cal-next" type="button">次月 &gt;</button>
    </div>
  </div>
  <div class="cal-status"></div>
  <div class="cal-weekdays">
    <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
  </div>
  <div class="cal-grid"></div>
  <div class="cal-legend"></div>
</div>

<div class="cal-modal-overlay" hidden>
  <div class="cal-modal" role="dialog" aria-modal="true">
    <button class="cal-modal-close" type="button" aria-label="閉じる">&times;</button>
    <div class="cal-modal-header">
      <span class="cal-modal-dot"></span>
      <h3 class="cal-modal-title"></h3>
    </div>
    <div class="cal-modal-datetime"></div>
    <div class="cal-modal-description"></div>
    <div class="cal-modal-footer">
      <a class="cal-modal-link cal-modal-add-link" href="#" target="_blank" rel="noopener noreferrer">+ マイカレンダーに追加</a>
      <a class="cal-modal-link" href="#" target="_blank" rel="noopener noreferrer">Googleカレンダーで詳細を見る ↗</a>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
